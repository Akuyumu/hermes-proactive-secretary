name: hermes-proactive-secretary
version: 1.1.4
kind: standalone
platforms:
  - linux
  - macos
description: >-
  Proactive ordinary-profile Hermes sessions that investigate, prepare useful
  work and notify through bounded notification gates using your existing
  tools, memory and permissions, with optional public-source collection and
  requested reminders. One command installs and verifies the two default native
  jobs; an explicit opt-in adds one preparation script job; one command
  truthfully disables only owned jobs.
author: Hermes Plugin Community
license: MIT
tags:
  - secretary
  - proactive
  - notifications
  - reminders
  - cron
provides_skills:
  - proactive-secretary
provides_cli_commands:
  - secretary
provides_tools:
  - secretary_onboarding
  - secretary_context
  - secretary_responsibility
  - secretary_propose_notice
  - secretary_followup
  - secretary_draft
provides_hooks:
  - pre_llm_call

# Ordinary native Desktop controls (Settings -> Plugins). Hermes reads this as a
# mapping of setting key -> field spec and writes edits under
# plugins.entries.hermes-proactive-secretary.settings.<key>, exactly where
# ctx.get_config reads them. These controls are projected from / merged into the
# same validated per-user configuration owner as configure/CLI and the scheduled
# runners. Complex source consent/account setup stays in the conversational/CLI
# flow rather than an opaque JSON editor.
config_schema:
  timezone:
    type: str
    title: Your timezone
    description: >-
      The city/region timezone used for quiet hours and the daily message
      allowance (for example UTC, Europe/London or America/New_York). This is
      a setting only; it does not connect any source.
    default: UTC
  destination:
    type: str
    title: Where messages are sent
    description: >-
      Leave empty to record messages locally without sending them. A chat
      target can be entered later, but delivery is only confirmed by an
      explicit canary; entering a target here does not verify it.
    default: ""
  daily_normal_cap:
    type: str
    title: Most ordinary messages per day (optional)
    description: >-
      An optional ceiling on ordinary messages per local day, never a target.
      Leave blank for no deterministic daily count limit: the secretary still
      stays restrained and useful rather than aiming at a number. Enter a whole
      number to set an explicit ceiling; 0 stops ordinary discretionary
      messages. Negative, fractional or non-numeric values are rejected. Urgent
      evidence and reminders you explicitly asked for keep their existing
      exceptions, so this is not a total-all-messages cap.
    default: ""
  quiet_start_hour:
    type: int
    title: Quiet hours begin (local hour)
    description: >-
      Ordinary messages wait from this hour (0-23). This is a quiet period,
      not a pause; urgent requested reminders are not silently discarded.
    default: 0
    minimum: 0
    maximum: 23
  quiet_end_hour:
    type: int
    title: Quiet hours end (local hour)
    description: >-
      Ordinary messages may resume from this hour (0-23). Set both quiet-hour
      fields together for the period you want.
    default: 8
    minimum: 0
    maximum: 23
  cooldown_minutes:
    type: int
    title: Minimum gap between messages (minutes)
    description: >-
      A short breathing space between ordinary messages so a busy day is not
      flooded with separate alerts.
    default: 30
    minimum: 0
    maximum: 1440
  public_feeds:
    type: bool
    title: Allow public-source checks
    description: >-
      This only switches on reading the public sources listed below. It adds
      no sources by itself: with an empty source list, public coverage is
      still none. Private mail, calendar and tasks need their own switches
      and authorised accounts.
    default: false
  obligations:
    type: bool
    title: Check mail for due payments and orders
    description: >-
      Reads accounts you have already connected and scoped to look for due
      payments, orders and similar commitments. Off means no mail is read for
      this purpose, even if mail is connected elsewhere.
    default: false
  mail_enabled:
    type: bool
    title: Check mail
    description: >-
      On means mail may be checked after a mail account is separately
      connected and authorised. It does not connect an account, grant access
      or make an unavailable connector work. Off keeps mail unread.
    default: false
  calendar_enabled:
    type: bool
    title: Check calendar
    description: >-
      On means the calendar may be checked after a calendar account is
      separately connected and scoped. It does not connect an account or
      grant access. Off keeps the calendar unread.
    default: false
  tasks_enabled:
    type: bool
    title: Check tasks
    description: >-
      On means tasks may be checked after a task account/list is separately
      connected and scoped. It does not connect an account or grant access.
      Off keeps tasks unread.
    default: false
  public_interests:
    type: array
    title: Public topics you care about
    description: >-
      Plain topic names used for public discovery. An empty list means none.
      These are not permissions and never open a private account. Clearing
      the list stays cleared.
    default: []
  public_sources:
    type: array
    title: Public pages or feeds to read
    description: >-
      Exact public source entries (kind and URL). An empty list means no
      public sources, even when public-source checks are on. Adding a source
      does not authorise any private account. Explicitly clearing this list
      is preserved.
    default: []
  discovery_mode:
    type: str
    title: Public discovery
    description: >-
      Choose disabled, shadow (prepare but do not act) or active. It stays
      disabled unless you choose otherwise. Discovery only uses the public
      sources and topics above; it does not widen private access.
    choices:
      - disabled
      - shadow
      - active
    default: disabled
  discovery_privacy_review:
    type: bool
    title: Extra privacy review for discovery
    description: >-
      Adds an optional semantic check before a public discovery result is
      used. It is not a permission and does not read private accounts.
    default: false
  discovery_inferred_goals:
    type: bool
    title: Allow guessed public goals
    description: >-
      When on, discovery may infer public goals from your stated interests.
      Inferred goals stay separate from facts you approved and never become a
      standing permission. Off by default.
    default: false
  context_refresh:
    type: bool
    title: Allow assistant context refresh
    description: >-
      When on, the assistant may refresh the bounded, expiring context snapshot
      with advisory facts, preferences and interests inferred from the current
      private conversation. Off by default. Inferred entries are advisory, never
      owner consent, and never open a source, account or grant. Pause, expiry,
      revocation and the existing entry caps still apply.
    default: false
  collector_budget_seconds:
    type: int
    title: Time limit for one collection run (seconds)
    description: >-
      The most time one run may spend collecting. A smaller limit is gentler
      on a slow connection; a larger limit may cover more sources.
    default: 60
    minimum: 5
    maximum: 600
  max_candidates_per_kind:
    type: int
    title: Most candidates kept per source kind
    description: >-
      A packet-size limit, not a promise of that many results. Fewer
      candidates means less noise; more means a broader look.
    default: 60
    minimum: 1
    maximum: 500
  feed_max_sources_per_run:
    type: int
    title: Public sources read per run
    description: >-
      A bound on how many public sources are read in one scheduled run. Use 0
      to read none while keeping the source list intact.
    default: 2
    minimum: 0
    maximum: 20
  preparation_enabled:
    type: bool
    title: Draft private preparation
    description: >-
      Opt-in drafting for responsibilities you explicitly accepted. Off by
      default. Turning it on does not create a scheduled job, grant a source
      scope or make a model available; those remain separate explicit steps.
    default: false
  preparation_mode:
    type: str
    title: Autonomy mode
    description: >-
      review_only blocks autonomous preparation even if older preparation was
      enabled. prepare_private allows private reversible drafts inside the
      chosen scopes; prepare_and_approve also asks before consequential work.
      An empty value is legacy configuration and grants nothing new.
    default: ""
  preparation_scopes:
    type: array
    title: What preparation may read
    description: >-
      Standing scopes you explicitly allow, such as conversation, public,
      mail, calendar, tasks, documents or memory. Empty means none. A public
      scope never implies access to private mail, calendar, tasks, documents
      or memory.
    default: []
  preparation_source_consent:
    type: bool
    title: Let preparation use already-checked facts
    description: >-
      When on with preparation scopes, preparation may read only fresh,
      bounded facts already cached from sources you enabled. It never opens a
      new account or connector and never fetches a source for the first time.
    default: false
  primary_provider:
    type: str
    title: Secretary model provider (optional)
    description: >-
      The provider for the secretary's own small task. Set both provider and
      model, or leave both empty to inherit the active chat model at first.
      The monitoring auxiliary route uses its existing routing rules. A native
      portal job snapshots the selected pair only when you explicitly enable or
      refresh it. An explicit native auxiliary pin always wins and is never
      changed here.
    default: ""
  primary_model:
    type: str
    title: Secretary model name (optional)
    description: >-
      The model name paired with the provider above. Both fields must be set
      together or both left empty. The monitoring auxiliary route uses its
      existing routing rules; a native portal job snapshots the selected pair
      only when you explicitly enable or refresh it.
    default: ""
  portal_reasoning_effort:
    type: str
    title: Background reasoning effort (optional)
    description: >-
      Reasoning effort for the native portal snapshot when you explicitly
      enable or refresh it; blank inherits the native effort. Accepted native
      levels: none, minimal, low, medium, high, xhigh, max, ultra. This does not
      change the monitoring auxiliary route.
    default: ""
  portal_cadence:
    type: str
    title: How often the portal runs
    description: >-
      The default cadence for the native portal job when preview or enable is
      run without an explicit schedule. Existing explicit schedules are
      honoured. This setting alone never creates, updates or arms a job.
    choices:
      - 3h
      - 6h
    default: 3h
  fallback_provider:
    type: str
    title: Backup model provider (optional)
    description: >-
      One configured backup provider to try if the primary route fails. Set
      both backup provider and model, or leave both empty. There is no
      escalation to the main/global model after this route fails. This backup
      pair applies to the monitoring auxiliary route only; a pinned native
      portal cron job does not inherit it.
    default: ""
  fallback_model:
    type: str
    title: Backup model name (optional)
    description: >-
      The model name paired with the backup provider. Both backup fields must
      be set together or both left empty. This backup pair is auxiliary-only
      and is not inherited by a pinned native portal cron job.
    default: ""
